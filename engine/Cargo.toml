[package]
name = "dnbm-engine"
version = "0.1.0"
edition = "2024"
publish = false
description = "dnbm's sequencer, synthesizer and mixer, compiled to WebAssembly"

# cdylib is the .wasm the browser and scripts/render.ts load; rlib lets cargo test
# exercise the same code natively.
[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
