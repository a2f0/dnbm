<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="dnbm player: dark drum and bass songs, synthesized in the browser by a WebAssembly engine."
    />
    <title>dnbm player</title>
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="stylesheet" href="../page.css" />
    <!-- main.js mounts the player from mount.js and styles.css; fetch them alongside it. -->
    <link rel="modulepreload" href="mount.js" />
    <link rel="preload" href="styles.css" as="style" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main id="app" class="page"></main>
    <noscript><p class="noscript">The dnbm player needs JavaScript and WebAssembly.</p></noscript>
  </body>
</html>
