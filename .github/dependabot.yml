---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      tooling:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /packages/synth/engine
    schedule:
      interval: monthly
