---
name: Publish npm package

# Publishes @a2f0/dnbm with npm trusted publishing: npm exchanges the publish job's
# GitHub OIDC token for a short-lived publish token and attaches provenance, so no
# npm token or one-time password is stored anywhere. The trusted publisher on
# npmjs.com names this file and the `npm` environment. ship-pr bumps package.json's
# version on every merge. Adapted from a2f0/skyline's npm-publish.yml: the test job
# runs the full suite, the pack job packs the tarball, and the publish job receives
# only that. See docs/package.md.
# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/npm-publish.yml
  workflow_dispatch:

permissions: {}

# Publish one version at a time, and never cancel a publish in progress. Runs queue
# per ref, so a test run dispatched on a branch never displaces a pending publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Dependencies, the build and the tests run without id-token, so no code they
  # execute can request the token npm exchanges for publish rights. Dispatching the
  # workflow on a branch tests it there; packing and publishing stay on main.
  test:
    name: Test @a2f0/dnbm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          version: 2026.10.3
          install_args: node shellcheck aqua:WebAssembly/binaryen
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Everything a merge must pass, including the package suite.
      - run: bun run check

  pack:
    name: Pack @a2f0/dnbm
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2
      # Publish only a version newer than npm's latest, so re-runs and out-of-order
      # runs succeed without publishing.
      - id: decide
        run: bun scripts/npmPublishDecision.ts
      - if: steps.decide.outputs.publish == 'true'
        run: rustup toolchain install
      - if: steps.decide.outputs.publish == 'true'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          version: 2026.10.3
          install_args: node aqua:WebAssembly/binaryen
          cache: true
      - if: steps.decide.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - if: steps.decide.outputs.publish == 'true'
        run: |
          bun run build:package
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
      - if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish @a2f0/dnbm
    needs: pack
    if: needs.pack.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Restricted to main in the repository settings, so a workflow edited on another
    # branch cannot obtain a token npm accepts.
    environment: npm
    permissions:
      id-token: write
    steps:
      # Only the packed tarball, verified against its upload digest: nothing from the
      # repository is checked out, installed or run here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm-package
          path: package
      # Trusted publishing needs npm 11.5.1 or later; Node 26.10.0 ships 11.19.1. No
      # registry-url: its .npmrc would point npm at an empty NODE_AUTH_TOKEN.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 26.10.0
          package-manager-cache: false
      # The ./ matters: npm reads a bare `package/<file>.tgz` as a GitHub owner/repo
      # shorthand and tries to clone it.
      - run: npm publish ./package/*.tgz --ignore-scripts
