---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up ShellCheck
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: 2026.9.1
          install_args: shellcheck
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git checkout -B "$HEAD_REF" && sh scripts/checks/lintBranchName.sh

      - name: Check for binary files
        run: sh scripts/checks/checkBinaryFiles.sh --all

      - name: Lint shell scripts
        run: sh scripts/checks/lintScripts.sh

      - name: Lint and format (Biome)
        run: bunx --no-install biome ci

      - name: Check song files
        run: bun run songs:check

      - name: Typecheck
        run: bun run typecheck

      - name: Check agent skills
        run: bun run agents:check

  engine:
    name: Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain rust-toolchain.toml pins, with rustfmt, clippy and the
      # WebAssembly target.
      - name: Install Rust
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --manifest-path engine/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path engine/Cargo.toml

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Set up wasm-opt
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: 2026.9.1
          install_args: aqua:WebAssembly/binaryen
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Check deploy config
        run: bunx --no-install wrangler deploy --dry-run

  # The single required check (see agent-tool.json).
  gate:
    name: CI gate
    if: always()
    needs: [lint, engine, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "Not every job succeeded: $RESULTS"
              exit 1
            fi
          done

  # Off until the repository variable DNBM_DEPLOY is "true" and the Cloudflare
  # secrets exist; `bun run deploy` deploys by hand meanwhile.
  deploy:
    name: Deploy
    needs: gate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DNBM_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Set up wasm-opt
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: 2026.9.1
          install_args: aqua:WebAssembly/binaryen
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
