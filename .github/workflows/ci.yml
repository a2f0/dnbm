---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun, Node and ShellCheck
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun node shellcheck
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: bun run lint:branch-name "$HEAD_REF"

      - name: Check for binary files
        run: bun run lint:binary-files --all

      - name: Lint shell scripts
        run: bun run lint:scripts

      - name: Lint and format (Biome)
        run: bunx --no-install biome ci

      - name: Check song files
        run: bun run songs:check

      - name: Typecheck
        run: bun run typecheck

      - name: Check agent skills
        run: bun run agents:check

      - name: Audit dependencies
        run: bun audit

  engine:
    name: Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain rust-toolchain.toml pins, with rustfmt, clippy and the
      # WebAssembly target.
      - name: Install Rust
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --manifest-path packages/synth/engine/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path packages/synth/engine/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path packages/synth/engine/Cargo.toml

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Set up Bun, Node and wasm-opt
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun node aqua:WebAssembly/binaryen
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Check deploy config
        run: bun run deploy:preview

  # The single required check (see agent-tool.json).
  gate:
    name: CI gate
    if: always()
    needs: [lint, engine, web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS" | bun run agent-tool ci gate - --policy scripts/checks/ci-gate.json

  # Off until the repository variable DNBM_DEPLOY is "true" and the Cloudflare
  # secrets exist; `bun run deploy` deploys by hand meanwhile.
  deploy:
    name: Deploy
    needs: gate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DNBM_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Set up Bun, Node and wasm-opt
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun node aqua:WebAssembly/binaryen
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
